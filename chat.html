<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aluminas · Conversas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
:root{--bg:#0f0f0f;--card:#181818;--border:#2a2a2a;--text:#e8e8e8;--muted:#9a9a9a;--accent:#c0922a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);max-width:440px;width:100%;padding:28px 24px;text-align:center}
h1{font-size:18px;margin-bottom:10px}
p{font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:20px}
a{display:inline-block;background:var(--accent);color:#000;font-weight:700;font-size:13px;text-decoration:none;padding:10px 18px}
</style>
</head>
<body>
<!-- O chat antigo acessava as tabelas direto, sem conferir a sessão.
     Fica fora do ar até ser refeito com o login único (código antigo no histórico do git). -->
<div class="box">
  <h1>Conversas em manutenção</h1>
  <p>As conversas estão temporariamente fora do ar enquanto passam para o login único do sistema.<br>Para falar com o PCP, abra um ticket.</p>
  <a href="index.html">Ir para os Tickets</a>
</div>
</body>
</html>
